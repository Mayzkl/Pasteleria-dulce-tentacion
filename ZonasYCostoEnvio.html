<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zona y costo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🍰 Dulce Tentación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

    
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">🛒 Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
        <h2 class="text-center mb-4">Carrito de compra</h2>

        <!-- Imagen del producto -->
        <div class="border bg-white p-4 text-center mb-3" style="width: 250px;">
            <p>IMG TORTA</p>
        </div>

        <!-- Detalles del producto -->
        <div class="text-center mb-3">
            <h5>Torta Frambuesa</h5>
            <p class="text-muted mb-1">20 personas</p>
            <p class="text-muted mb-1">Manjar</p>
            <p><strong>Sub Total: $29.990</strong></p>
        </div>

        <!-- Dirección de envío -->
        <div class="border p-3 bg-white mb-3" style="width: 300px;">
            <h5 class="mb-3 text-center">Dirección de envío</h5>
            <form>
                <div class="mb-3">
                    <label class="form-label">Comuna</label>
                    <select class="form-select">
                        <option value="">Seleccione comuna</option>
                        <option>Santiago Centro</option>
                        <option>Providencia</option>
                        <option>Ñuñoa</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Calle</label>
                    <input type="text" class="form-control" placeholder="Ej: Av. Alameda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" placeholder="Ej: 1234">
                </div>
                <p><strong>Sub total envío: $Depende comuna</strong></p>
            </form>
        </div>

        <!-- Total y acción -->
        <div class="text-center">
            <h4>Total: $33.890</h4>
            <button class="btn btn-primary btn-lg mt-2">Proceder al pago</button>
        </div>
    </div>

</body>
</html>
