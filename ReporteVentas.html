<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reporte ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🍰 Dulce Tentación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

    
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">🛒 Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
        <h2 class="text-center mb-4">Reporte por período</h2>

        <!-- Filtros de búsqueda -->
        <form class="border bg-white p-4 rounded mb-4" style="max-width: 500px; width: 100%;">
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Fecha inicio</label>
                    <input type="date" class="form-control" value="2025-01-01">
                </div>
                <div class="col">
                    <label class="form-label">Fecha fin</label>
                    <input type="date" class="form-control" value="2025-12-31">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Canal</label>
                    <select class="form-select">
                    <option>Web</option>
                    <option>Tienda</option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Estado</label>
                    <select class="form-select">
                        <option>Completo</option>
                        <option>Pendiente</option>
                        <option>Cancelado</option>
                    </select>
                </div>
            </div>
        </form>

        <!-- Exportar -->
        <h5 class="mb-3">Exportar reporte</h5>
        <div class="d-flex gap-3">
            <button class="btn btn-primary">Como PDF</button>
            <button class="btn btn-info text-white">Archivo CSV</button>
        </div>
    </div>

</body>
</html>
