<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Iniciar sesion</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
    </head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"> Dulce Tentación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

    
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"> Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-fill d-flex justify-content-center align-items-center">
        <div class="card shadow p-4" style="min-width: 350px; max-width: 380px;">
            <h2 class="mb-4 text-center">Iniciar sesión</h2>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label">Correo electronico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@email.com" required>
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="********" required minlength="8">
                    <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </main>

    <div class="modal fade" id="loginExitoso" tabindex="-1" aria-labelledby="loginExitosoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="loginExitosoLabel">Inicio de sesión exitoso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¡Bienvenido de nuevo a Dulce Tentación!</p>
                    <button class="btn btn-success" id="btnContinuar">Ir al catálogo</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
            const form = document.getElementById('loginForm');
            const modal = new bootstrap.Modal(document.getElementById('loginExitoso'));

            form.addEventListener('submit', e => {
                e.preventDefault();

                if (!form.checkValidity()) {
                    e.stopPropagation();
                    form.classList.add('was-validated');
                } else {
                
                    modal.show();
                    form.reset();
                    form.classList.remove('was-validated');
                }
            });

            // Redirección al catálogo después de iniciar sesión
            document.getElementById('btnContinuar').addEventListener('click', () => {
                window.location.href = "catalogo.html";
            });
        </script>
</body>
</html>
