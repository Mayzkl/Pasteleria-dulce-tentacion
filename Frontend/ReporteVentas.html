<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reporte de ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>

    <div class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Reporte de ventas</h2>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="fw-semibold">Total órdenes:</span>
                        <span id="totalOrdenes">0</span>
                    </div>
                    <div>
                        <span class="fw-semibold">Total vendido:</span>
                        <span id="totalVendido">$0</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead>
                            <tr>
                                <th>N° Orden</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVentas">
                            <!-- filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">
                Volver al inicio
            </button>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script src="reporteventas.js"></script>
</body>
</html>
