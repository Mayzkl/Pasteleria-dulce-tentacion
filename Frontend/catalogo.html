<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Catálogo de tortas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color: #ffffff;" class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"> Dulce Tentación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

    
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito_compra.html"> Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <section class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Catálogo de tortas</h2>
        <!-- Filtros -->
        <div class="row mb-4 justify-content-center">
            <div class="col-md-5 mb-2">
                <input type="text" class="form-control shadow-sm" placeholder="Buscar productos...">
            </div>
            <div class="col-md-3 mb-2">
                <select class="form-select shadow-sm">
                    <option selected>Todas las categorías</option>
                    <option>Tortas clásicas</option>
                    <option>Tortas frutales</option>
                    <option>Tortas especiales</option>
                </select>
            </div>
        </div>
        <div id="listaProductos" class="row g-4"></div>
    </section>
        
    <!-- Footer -->
    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="productos.js"></script>

    <script>
    const contenedor = document.getElementById('listaProductos');

    PRODUCTOS.forEach(prod => {
        const col = document.createElement('div');
        col.className = 'col-md-4';

        col.innerHTML = `
            <div class="card h-100 shadow-sm">
                <img src="${prod.imagen}" class="card-img-top" alt="${prod.nombre}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">${prod.nombre}</h5>
                    <p class="card-text">${prod.descripcionCorta}</p>
                    <p class="fw-bold mb-3">${formatearPrecio(prod.precio)}</p>
                    <button class="btn btn-primary mt-auto"
                            onclick="window.location.href='personalizacion.html?id=${prod.id}'">
                        Personalizar
                    </button>
                </div>
            </div>
        `;

        contenedor.appendChild(col);
    });
</script>
</body>
</html>
