<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de tortas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color: #fff7f0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>
    <!-- Contenido principal -->
    <section class="container my-4">
        <h2 class="text-center fw-bold mb-4">Catálogo de tortas</h2>

        <!-- Filtros -->
        <div class="row mb-3 justify-content-center">
            <div class="col-12 col-md-6 mb-2">
                <input id="buscar" type="text" class="form-control shadow-sm" placeholder="Buscar productos...">
            </div>
            <div class="col-12 col-md-4 mb-2">
                <select id="categoria" class="form-select shadow-sm">
                    <option selected value="">Todas las categorías</option>
                    <option value="clasica">Tortas clásicas</option>
                    <option value="frutal">Tortas frutales</option>
                    <option value="especial">Tortas especiales</option>
                </select>
            </div>
        </div>

        <!-- Grid actualizado -->
        <div id="gridCatalogo" class="row g-3"></div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>
    <script src="productos.js"></script>

    <script>
        const contenedor = document.getElementById('gridCatalogo');

        PRODUCTOS.forEach(prod => {
            const col = document.createElement('div');
            col.className = 'col-12 col-md-4';

            col.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <img src="${prod.imagen}" class="card-img-top" alt="${prod.nombre}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${prod.nombre}</h5>
                        <p class="card-text">${prod.descripcionCorta}</p>
                        <p class="fw-bold mb-3">${formatearPrecio(prod.precio)}</p>
                        <button class="btn btn-primary mt-auto"
                                onclick="window.location.href='personalizacion.html?id=${prod.id}'">
                            Personalizar
                        </button>
                    </div>
                </div>
            `;
            contenedor.appendChild(col);
        });
    </script>
</body>
</html>
