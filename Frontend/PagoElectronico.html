<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pago electrónico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>

    <div class="container my-4">
        <h2 class="text-center mb-4 fw-bold">Pago electrónico</h2>

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 text-center">

                <!-- Resumen pedido -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Resumen del pedido</h5>
                        <p id="resumenEntrega" class="mb-2"></p>
                        <p id="resumenTotal" class="fw-bold mb-0"></p>
                    </div>
                </div>

                <!-- Formulario de pago -->
                <div class="card shadow-sm text-start">
                    <div class="card-body">
                        <h5 class="card-title mb-3 text-center text-md-start">Datos de tarjeta</h5>

                        <div class="mb-3">
                            <label class="form-label">Número de tarjeta</label>
                            <input id="tarjeta" type="text" class="form-control" placeholder="1111 2222 3333 4444">
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label">Vencimiento</label>
                                <input id="vencimiento" type="text" class="form-control" placeholder="MM/AA">
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input id="cvv" type="password" class="form-control" placeholder="123">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre del titular</label>
                            <input id="titular" type="text" class="form-control" placeholder="Nombre como aparece en la tarjeta">
                        </div>

                        <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-3">
                            <button class="btn btn-outline-secondary w-100 w-md-auto"
                                    onclick="window.location.href='SeleccionDeEntrega.html'">
                                Volver
                            </button>
                            <button id="btnConfirmarPago" class="btn btn-success w-100 w-md-auto">
                                Confirmar pago
                            </button>
                        </div>

                        <p id="mensajeError" class="text-danger mt-3 d-none text-center text-md-start">
                            Debes completar todos los campos para continuar.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="keycloak-config.js"></script>
    <script src="usuarios.js"></script>
    <script src="productos.js"></script>
    <script src="carrito.js"></script>
    <script src="navbar.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const CLAVE_ENTREGA   = "entrega_dulce_tentacion";
        const CLAVE_CARRITO   = "carrito_dulce_tentacion";
        const CLAVE_ORDEN     = "orden_dulce_tentacion";
        const CLAVE_HISTORIAL = "historial_ventas_dulce_tentacion";

        const entrega = JSON.parse(localStorage.getItem(CLAVE_ENTREGA) || "{}");

        // Leer carrito
        let carrito = [];
        try {
            if (typeof obtenerCarrito === "function") {
                carrito = obtenerCarrito();
            } else {
                carrito = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || "[]");
            }
        } catch (e) {
            console.error("Error leyendo carrito:", e);
            carrito = [];
        }

        // Helper para formatear precios
        function formatear(valor) {
            return "$" + (valor || 0).toLocaleString("es-CL");
        }

        // Calcular totales
        const totalProductos = carrito.reduce(
            (acc, item) => acc + (item.subtotal || item.precio || 0),
            0
        );
        const costoEnvio = entrega.costoEnvio || 0;
        const total = totalProductos + costoEnvio;

        // Pintar resumen en pantalla
        const resumenEntregaEl = document.getElementById("resumenEntrega");
        const resumenTotalEl   = document.getElementById("resumenTotal");

        if (resumenEntregaEl) {
            const tipoTxt =
                entrega.tipoEntrega === "envio"
                    ? "Envío a domicilio"
                    : "Retiro en tienda";

            resumenEntregaEl.textContent =
                `Entrega para ${entrega.nombreDestinatario || "(sin nombre)"} ` +
                `en ${entrega.direccion || "(sin dirección)"}, ${entrega.comuna || ""}. ` +
                `Fecha: ${entrega.fechaEntrega || "-"} (${entrega.franjaEntrega || "-"}) — ${tipoTxt}`;
        }

        if (resumenTotalEl) {
            resumenTotalEl.textContent =
                `Total a pagar: ${formatear(total)} ` +
                `(incluye envío: ${formatear(costoEnvio)})`;
        }

        // Lógica de pago
        const btnConfirmarPago = document.getElementById("btnConfirmarPago");
        const mensajeError     = document.getElementById("mensajeError");

        if (!btnConfirmarPago) {
            console.error("No se encontró el botón con id='btnConfirmarPago'. Revisa el HTML.");
            return;
        }

        btnConfirmarPago.addEventListener("click", () => {
            const tarjeta = document.getElementById("tarjeta").value.trim();
            const venc    = document.getElementById("vencimiento").value.trim();
            const cvv     = document.getElementById("cvv").value.trim();
            const titular = document.getElementById("titular").value.trim();

            // Validación básica del formulario de tarjeta
            if (!tarjeta || !venc || !cvv || !titular) {
                if (mensajeError) {
                    mensajeError.classList.remove("d-none");
                }
                return;
            }

            if (mensajeError) {
                mensajeError.classList.add("d-none");
            }

            // Generar número de orden 
            const numeroOrden = "DT-" + Math.floor(100000 + Math.random() * 900000);

            // Construir objeto de orden 
            const orden = {
                numero: numeroOrden,
                total: total,
                fechaCreacion: new Date().toISOString(),
                estado: "Pagada",
                entrega: entrega,
                productos: carrito
            };

            // Guardar orden actual en localStorage 
            localStorage.setItem(CLAVE_ORDEN, JSON.stringify(orden));
            localStorage.setItem("ultimo_pedido_dulce_tentacion", JSON.stringify(orden));

            const historialActual = JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || "[]");
            historialActual.push(orden);
            localStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(historialActual));

            // Usuario actual desde localStorage o Keycloak
            let usuarioActual = null;
            try {
                if (typeof obtenerUsuarioActual === "function") {
                    usuarioActual = obtenerUsuarioActual();
                }
            } catch (e) {
                console.warn("No se pudo obtener usuario actual:", e);
            }

            const payload = {
                numero: numeroOrden,

                entrega: {
                    nombreDestinatario: entrega.nombreDestinatario || "",
                    direccion:          entrega.direccion || "",
                    comuna:             entrega.comuna || "",
                    fechaEntrega:       entrega.fechaEntrega || "",
                    franjaEntrega:      entrega.franjaEntrega || "",
                    tipoEntrega:        entrega.tipoEntrega || "",
                    costoEnvio:         Number(entrega.costoEnvio || 0)
                },

                // datos del usuario
                usuario: usuarioActual
                    ? {
                        id:     usuarioActual._id || usuarioActual.id || null,
                        nombre: usuarioActual.nombre  || usuarioActual.username || "cliente",
                        email:  usuarioActual.email   || ""
                    }
                    : {
                        id: null,
                        nombre: "Sin nombre",
                        email: ""
                    },

                // productos
                items: carrito.map(p => ({
                    id:       p.id,
                    nombre:   p.nombre,
                    precio:   Number(p.subtotal ?? p.precio ?? 0),
                    imagen:   p.imagen || "",
                    tamano:   p.tamano || "",
                    relleno:  p.relleno || "",
                    mensaje:  p.mensaje || ""
                }))
            };


            fetch("http://localhost:3900/api/pedidos/crear", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                console.log("[PagoElectronico] Pedido guardado en backend:", data);
            })
            .catch(err => {
                console.error("Error al guardar pedido en backend:", err);
            });

            localStorage.removeItem(CLAVE_CARRITO);

            window.location.href = "BoletaDigital.html";
        });
    });
    </script>



</body>
</html>
