<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pago electronico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Dulce Tentación</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

    
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito_compra.html">Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Pago electronico</h2>

        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <!-- Resumen pedido-->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Resumen del pedido</h5>
                        <p id="resumenEntrega" class="mb-2"></p>
                        <p id="resumenTotal" class="fw-bold"mb-0></p>
                    </div>
                </div>
                <!-- Formulario de pago (Simulado por el momento) -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Datos de tarjeta</h5>

                        <div class="mb-3">
                            <label class="form-label">Número de tarjeta</label>
                            <input id="tarjeta" type="text" class="form-control" placeholder="1111 2222 3333 4444">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vencimiento</label>
                                <input id="vencimiento" type="text" class="form-control" placeholder="MM/AA">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input id="cvv" type="password" class="form-control" placeholder="123">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre del titular</label>
                            <input id="titular" type="text" class="form-control">
                        </div>

                        <div class="d-flex justify-content-between">
                            <button class="btn btn-outline-secondary"
                                    onclick="window.location.href='SeleccionDeEntrega.html'">
                                Volver
                            </button>
                            <button id="btnConfirmarPago" class="btn btn-success">
                                Confirmar pago
                            </button>
                        </div>

                        <p id="mensajeError" class="text-danger mt-3 d-none">
                            Debes completar todos los campos para continuar.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>


        

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CLAVE_ENTREGA = "datos_entrega_dulce_tentacion";
        const CLAVE_ORDEN   = "orden_dulce_tentacion";

        const datosEntrega = JSON.parse(localStorage.getItem(CLAVE_ENTREGA) || "{}");

        function formatear(valor) {
            return "$" + valor.toLocaleString("es-CL");
        }

        const resumenEntrega = document.getElementById('resumenEntrega');
        const resumenTotal   = document.getElementById('resumenTotal');

        const total = (datosEntrega.totalProductos || 0) + (datosEntrega.costoEnvio || 0);

        resumenEntrega.textContent =
            `Entrega para ${datosEntrega.nombreDestinatario || "(sin nombre)"} en ` +
            `${datosEntrega.direccion || "(sin dirección)"}, ${datosEntrega.comuna || ""}. ` +
            `Fecha: ${datosEntrega.fecha || "-"} (${datosEntrega.franja || "-"})`;

        resumenTotal.textContent =
            `Total a pagar: ${formatear(total)} (incluye envío: ${formatear(datosEntrega.costoEnvio || 0)})`;

        const btnConfirmarPago = document.getElementById('btnConfirmarPago');
        const mensajeError     = document.getElementById('mensajeError');

        btnConfirmarPago.addEventListener('click', () => {
            const tarjeta = document.getElementById('tarjeta').value.trim();
            const venc    = document.getElementById('vencimiento').value.trim();
            const cvv     = document.getElementById('cvv').value.trim();
            const titular = document.getElementById('titular').value.trim();

            if (!tarjeta || !venc || !cvv || !titular) {
                mensajeError.classList.remove('d-none');
                return;
            }

            mensajeError.classList.add('d-none');

            // Generar número de orden simple
            const numeroOrden = "DT-" + Math.floor(100000 + Math.random() * 900000);

            const orden = {
                numero: numeroOrden,
                total: total,
                fechaCreacion: new Date().toISOString(),
                estado: "En preparación",
                entrega: datosEntrega
            };

            localStorage.setItem(CLAVE_ORDEN, JSON.stringify(orden));

            // Ir a boleta digital
            window.location.href = "BoletaDigital.html";
        });
    </script>
</body>
</html>
