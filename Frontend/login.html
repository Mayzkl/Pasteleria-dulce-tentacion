<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Iniciar sesion</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
    </head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>
    <main class="flex-fill d-flex justify-content-center align-items-center px-3 py-4">
        <div class="card shadow p-4 w-100" style="max-width: 380px;">
            <h2 class="mb-4 text-center">Iniciar sesión</h2>
            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="correoLogin" class="form-control" placeholder="ejemplo@email.com" required>
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="passwordLogin" class="form-control" placeholder="********" required minlength="8">
                    <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                <p id="msgLogin" class="mt-2"></p>
            </form>
        </div>
    </main>

    <!-- Modal login exitoso -->
    <div class="modal fade" id="loginExitoso" tabindex="-1" aria-labelledby="loginExitosoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="loginExitosoLabel">Inicio de sesión exitoso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¡Bienvenido de nuevo a Dulce Tentación!</p>
                    <button class="btn btn-success" id="btnContinuar">Ir al catálogo</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="keycloak-config.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const form   = document.getElementById("formLogin");
        const msg    = document.getElementById("msgLogin");
        const modal  = new bootstrap.Modal(document.getElementById("loginExitoso"));
        const btnIr  = document.getElementById("btnContinuar");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("correoLogin").value.trim();
            const pass  = document.getElementById("passwordLogin").value.trim();

            if (!email || !pass) {
                msg.textContent = "Ingresa correo y contraseña.";
                msg.className   = "mt-2 text-danger";
                return;
            }

            try {
                const resp = await fetch("http://localhost:3900/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password: pass })
                });

                if (!resp.ok) {
                    let data = null;
                    try {
                        data = await resp.json();
                    } catch (e) {}

                    msg.textContent = (data && data.mensaje) || "Error en login.";
                    msg.className   = "mt-2 text-danger";
                    return;
                }

                const data = await resp.json();
                guardarSesion(data.usuario);

                msg.textContent = "Inicio de sesión exitoso.";
                msg.className   = "mt-2 text-success";

                modal.show();
                btnIr.onclick = () => {
                    window.location.href = "index.html";
                };

            } catch (error) {
                console.error(error);
                msg.textContent = "Error al conectar con el servidor (¿backend apagado o URL incorrecta?).";
                msg.className   = "mt-2 text-danger";
            }
        });
    });
    </script>
</body>
</html>
