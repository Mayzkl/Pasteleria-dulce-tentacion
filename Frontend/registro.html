<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Registro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
    </head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>
    <main class="flex-fill d-flex justify-content-center align-items-center px-3 py-4">
        <div class="card shadow p-4 w-100" style="max-width: 380px;">
            <h2 class="mb-4 text-center">Registro</h2>
            <form id="formRegistro">
                <div class="mb-3">
                    <label class="form-label">Ingresa tu nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
                    <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                    <div class="invalid-feedback">Por favor ingresa un correo válido.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" minlength="8" placeholder="********" required>
                    <div class="invalid-feedback">Debe tener al menos 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="password2" placeholder="********" required>
                    <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                <p id="msgRegistro"></p>
            </form>
        </div>
    </main>

    <!-- Modal registro exitoso -->
    <div class="modal fade" id="registroExitoso" tabindex="-1" aria-labelledby="registroExitosoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="registroExitosoLabel">Registro exitoso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Tu cuenta fue creada correctamente.</p>
                    <button class="btn btn-success" id="btnContinuar">Continuar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("formRegistro");
        const msg  = document.getElementById("msgRegistro");
        const modal = new bootstrap.Modal(document.getElementById("registroExitoso"));
        const btnContinuar = document.getElementById("btnContinuar");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nombre  = document.getElementById("nombre").value.trim();
            const correo  = document.getElementById("correo").value.trim();
            const pass1   = document.getElementById("password").value.trim();
            const pass2   = document.getElementById("password2").value.trim();

            // Validaciones básicas
            if (!nombre || !correo || !pass1 || !pass2) {
                msg.textContent = "Completa todos los campos.";
                msg.className   = "mt-2 text-danger";
                return;
            }

            if (pass1.length < 8) {
                msg.textContent = "La contraseña debe tener al menos 8 caracteres.";
                msg.className   = "mt-2 text-danger";
                return;
            }

            if (pass1 !== pass2) {
                msg.textContent = "Las contraseñas no coinciden.";
                msg.className   = "mt-2 text-danger";
                return;
            }

            try {
                const resp = await fetch("http://localhost:3900/api/crearUsuario", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre,
                        email: correo,
                        password: pass1
                    })
                });

                const data = await resp.json();

                if (!resp.ok || data.status !== "success") {
                    msg.textContent = data.mensaje || "No se pudo registrar el usuario.";
                    msg.className   = "mt-2 text-danger";
                    return;
                }

                // Registro OK
                msg.textContent = "Registro exitoso. Ahora puedes iniciar sesión.";
                msg.className   = "mt-2 text-success";
                form.reset();

                // Mostrar modal y luego ir al login
                modal.show();
                btnContinuar.onclick = () => {
                    window.location.href = "login.html";
                };

            } catch (error) {
                console.error(error);
                msg.textContent = "Error al conectar con el servidor.";
                msg.className   = "mt-2 text-danger";
            }
        });
    });
    </script>
</body>
</html>
