<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Personalización</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>

    <div class="container my-4">
        <h2 class="text-center mb-4">Personalización de torta</h2>

        <div class="row justify-content-center">
            <!-- Imagen del producto -->
            <div class="col-12 col-md-4 text-center mb-4 mb-md-0">
                <div class="border bg-white p-3 shadow-sm rounded">
                    <img id="imgProducto"
                        src="https://velvetbakery.cl/cdn/shop/products/MerengueFrambuesaCSh.jpg?v=1666199845"
                        class="img-fluid rounded"
                        alt="Torta Frambuesa">
                </div>
            </div>

            <!-- Opciones de personalización -->
            <div class="col-12 col-md-6">
                <h4 id="tituloProducto" class="mb-3">Torta Frambuesa</h4>

                <div class="mb-3">
                    <label class="form-label">1) Selecciona tamaño</label>
                    <select id="selectTamano" class="form-select shadow-sm">
                        <option>10 personas</option>
                        <option>15 personas</option>
                        <option>20 personas</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">2) Selecciona relleno</label>
                    <select id="selectRelleno" class="form-select shadow-sm">
                        <option>Manjar</option>
                        <option>Crema</option>
                        <option>Chocolate</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">3) Mensaje personalizado</label>
                    <input id="inputMensaje"
                        type="text"
                        class="form-control shadow-sm"
                        maxlength="40"
                        placeholder="Máx. 40 caracteres">
                </div>

                <!-- Botones -->
                <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-4">
                    <button id="btnPrecio" class="btn btn-success w-100 w-md-auto">
                        Precio: $21.990
                    </button>
                    <button id="btnAgregarCarrito" class="btn btn-primary w-100 w-md-auto">
                        Añadir al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="productos.js"></script>
    <script src="carrito.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        // Leer el id desde la URL
        const params = new URLSearchParams(window.location.search);
        const idProducto = params.get("id");

        if (!idProducto) {
            alert("No se indicó qué producto personalizar.");
            window.location.href = "catalogo.html";
            return;
        }

        try {
            // Obtener producto desde el backend
            const resp = await fetch(`http://localhost:3900/api/productos/obtener/${idProducto}`);
            const data = await resp.json();

            if (!resp.ok || data.status !== "success") {
                alert(data.mensaje || "No se pudo cargar el producto.");
                window.location.href = "catalogo.html";
                return;
            }

            const p = data.producto;

            // Adaptar al formato que usa carrito.js
            const producto = {
                id: p._id,
                nombre: p.titulo || "Producto sin nombre",
                precio: p.precio || 0,
                imagen: p.imagen || ""
            };

            // Pintar datos en la vista
            const imgProducto = document.getElementById("imgProducto");
            const tituloProducto = document.getElementById("tituloProducto");
            const btnPrecio = document.getElementById("btnPrecio");

            if (imgProducto) {
                imgProducto.src = producto.imagen || imgProducto.src;
                imgProducto.alt = producto.nombre;
            }

            if (tituloProducto) {
                tituloProducto.textContent = producto.nombre;
            }

            if (btnPrecio) {
                if (typeof formatearPrecio === "function") {
                    btnPrecio.textContent = "Precio: " + formatearPrecio(producto.precio);
                } else {
                    btnPrecio.textContent = "Precio: $" + producto.precio;
                }
            }

            // Click en "Añadir al carrito"
            const btnAgregar = document.getElementById("btnAgregarCarrito");
            if (btnAgregar) {
                btnAgregar.addEventListener("click", () => {
                    const tamano  = document.getElementById("selectTamano").value;
                    const relleno = document.getElementById("selectRelleno").value;
                    const mensaje = document.getElementById("inputMensaje").value;

                    // Esta función viene de carrito.js 
                    agregarAlCarrito(producto, { tamano, relleno, mensaje });

                    alert("La torta fue agregada al carrito");
                    window.location.href = "carrito.html";
                });
            }

        } catch (error) {
            console.error("Error al cargar producto para personalización:", error);
            alert("Error al cargar el producto. Intenta nuevamente.");
            window.location.href = "catalogo.html";
        }
    });
    </script>
</body>
</html>
