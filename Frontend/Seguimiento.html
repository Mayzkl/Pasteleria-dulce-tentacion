<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seguimiento del pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>
    <div class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Seguimiento del pedido</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <p id="numeroOrden" class="fw-bold mb-1">Pedido: -</p>
                            <p id="infoEntrega" class="mb-0 text-muted"></p>
                        </div>
                        <div class="text-end">
                            <span id="estadoActual" class="badge bg-primary">En preparación</span>
                        </div>
                    </div>
                </div>

                <!-- Línea de estados -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Estado del pedido</h5>

                        <div class="row text-center">
                            <div class="col-6 col-md-3 mb-3">
                                <div id="step-recibido" class="p-3 border rounded-3">
                                    <div class="fw-bold">Recibido</div>
                                    <small>Orden generada</small>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div id="step-preparacion" class="p-3 border rounded-3">
                                    <div class="fw-bold">En preparación</div>
                                    <small>Horneando tu pedido</small>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div id="step-despacho" class="p-3 border rounded-3">
                                    <div class="fw-bold">En despacho</div>
                                    <small>En camino</small>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div id="step-entregado" class="p-3 border rounded-3">
                                    <div class="fw-bold">Entregado</div>
                                    <small>Pedido completado</small>
                                </div>
                            </div>
                        </div>

                        <p id="mensajeEstado" class="mt-3 mb-0"></p>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">
                        Volver al inicio
                    </button>
                    <button class="btn btn-danger" onclick="window.location.href='AnularCompra.html'">
                        Anular pedido
                    </button>
                    <button class="btn btn-outline-primary" onclick="window.location.href='BoletaDigital.html'">
                        Ver boleta
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>
    <script>
        const CLAVE_ORDEN     = "orden_dulce_tentacion";
        const CLAVE_HISTORIAL = "historial_ventas_dulce_tentacion";

        function leerOrdenActual() {
            try {
                return JSON.parse(localStorage.getItem(CLAVE_ORDEN) || "null");
            } catch {
                return null;
            }
        }

        function leerHistorial() {
            try {
                return JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || "[]");
            } catch {
                return [];
            }
        }

        function formatearFecha(fechaIso) {
            if (!fechaIso) return "-";
            const f = new Date(fechaIso);
            return f.toLocaleString("es-CL");
        }

        function activarPaso(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add("bg-success", "text-white");
            el.classList.remove("border");
        }
        // Carga de datos
        const numeroOrdenEl  = document.getElementById("numeroOrden");
        const infoEntregaEl  = document.getElementById("infoEntrega");
        const estadoActualEl = document.getElementById("estadoActual");
        const mensajeEstadoEl= document.getElementById("mensajeEstado");

        let orden = leerOrdenActual();

        if (!orden) {
            numeroOrdenEl.textContent  = "Pedido: (sin pedido reciente)";
            infoEntregaEl.textContent  = "No se encontró información de seguimiento.";
            estadoActualEl.textContent = "Sin pedido";
            estadoActualEl.className   = "badge bg-secondary";
            mensajeEstadoEl.textContent =
                "Realiza una compra para poder visualizar el seguimiento.";
        } else {
            // Intentar refrescar estado con el historial
            const historial = leerHistorial();
            const encontrada = historial.find(o => (o.numero || "") === (orden.numero || ""));
            if (encontrada) {
                orden.estado = encontrada.estado || orden.estado;
            }

            const entrega = orden.entrega || {};

            numeroOrdenEl.textContent = "Pedido: " + (orden.numero || "DT-XXXXXX");
            infoEntregaEl.textContent =
                "Entrega el " + (entrega.fecha || "-") +
                " en " + (entrega.comuna || "-") +
                " (" + (entrega.franja || "-") + ")";

            const estado = orden.estado || "En preparación";
            estadoActualEl.textContent = estado;

            // Color del badge según estado
            let badgeClass = "badge bg-primary";
            if (estado === "En preparación") badgeClass = "badge bg-warning text-dark";
            if (estado === "En despacho")    badgeClass = "badge bg-info text-dark";
            if (estado === "Entregado")      badgeClass = "badge bg-success";
            if (estado === "Anulación solicitada") badgeClass = "badge bg-danger";
            if (estado === "Anulada")             badgeClass = "badge bg-dark";
            estadoActualEl.className = badgeClass;

            // Reset visual de pasos (por si recargas muchas veces)
            ["step-recibido","step-preparacion","step-despacho","step-entregado"].forEach(id => {
                const el = document.getElementById(id);
                el.className = "p-3 border rounded-3";
            });

            // Marcar pasos según estado (solo tiene sentido para el flujo normal)
            activarPaso("step-recibido");
            if (["En preparación","En despacho","Entregado","Anulación solicitada","Anulada"].includes(estado)) {
                activarPaso("step-preparacion");
            }
            if (["En despacho","Entregado"].includes(estado)) {
                activarPaso("step-despacho");
            }
            if (estado === "Entregado") {
                activarPaso("step-entregado");
            }

            // Mensaje descriptivo
            let mensaje = "";
            switch (estado) {
                case "Recibido":
                    mensaje = "Tu pedido fue recibido correctamente y está en cola para ser preparado.";
                    break;
                case "En preparación":
                    mensaje = "Nuestro equipo está preparando tu torta con todos los detalles que elegiste.";
                    break;
                case "En despacho":
                    mensaje = "Tu pedido salió a reparto. Pronto debería llegar a la dirección indicada.";
                    break;
                case "Entregado":
                    mensaje = "Tu pedido fue entregado. ¡Esperamos que lo disfrutes!";
                    break;
                case "Anulación solicitada":
                    mensaje = "Se ha recibido tu solicitud de anulación. El equipo revisará el caso y confirmará la cancelación.";
                    break;
                case "Anulada":
                    mensaje = "La orden fue anulada. Si corresponde, la devolución o cancelación del pago será gestionada.";
                    break;
                default:
                    mensaje = "Pedido registrado. El estado detallado aún no está disponible.";
            }

            mensajeEstadoEl.textContent = mensaje;
        }
    </script>

</body>
</html>
