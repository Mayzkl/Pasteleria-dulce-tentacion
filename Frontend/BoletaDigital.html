<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boleta digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>
    <div class="container my-5 text-center">
        <h2 class="mb-4 fw-bold">Boleta electrónica</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!--Datos de la boleta-->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title mb-1">Dulce Tentacion</h5>
                                <small class="text-muted">Pasteleria online</small>
                            </div>
                            <div class="text-end">
                                <p id="numeroBoleta" class="fw-bold mb-0">Boleta N°</p>
                                <small id="fechaBoleta" class="text-muted"></small>
                            </div>
                        </div>
                        <hr>
                        <p id="datosCliente" class="mb-1"></p>
                        <p id="datosEntrega" class="mb-0 text-muted"></p>
                    </div>
                </div>
                
                <!--Detalle productos-->
                <div class="card shadow-sm mb-4">
                    <div class=" card-body">
                        <h5 class="card-title mb-3">Detalle de la compra</h5>
                        <div class="table-responsive">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th class="text-center">tamaño</th>
                                        <th>Mensaje</th>
                                        <th class="text-end">Precio</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos">
                                    <!--Items carrito-->
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex flex-column align-items-end mt-3">
                            <p id="subtotalBoleta" class="mb-1">Subtotal: $0</p>
                            <p id="envioBoleta" class="mb-1">Envio: $0</p>
                            <p id="totalBoleta" class="fw-bold mb-0">Total: $0</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">Volver al inicio</button>
                    <button class="btn btn-primary" onclick="window.location.href='Seguimiento.html'">Ver seguimiento del pedido</button>
                </div>
            </div>
        </div>
    </div>    

    <!-- Footer -->
    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>

    <script>
        const CLAVE_ORDEN   = "orden_dulce_tentacion";
        const CLAVE_ENTREGA = "datos_entrega_dulce_tentacion";

        const orden        = JSON.parse(localStorage.getItem(CLAVE_ORDEN)   || "{}");
        const datosEntrega = orden.entrega || JSON.parse(localStorage.getItem(CLAVE_ENTREGA) || "{}");

        // 👇 AHORA LOS PRODUCTOS SALEN DE LA ORDEN
        const carrito = orden.productos || [];

        function formatear(valor) {
            return "$" + (valor || 0).toLocaleString("es-CL");
        }

        // === Encabezado ===
        const numeroBoletaEl = document.getElementById("numeroBoleta");
        const fechaBoletaEl  = document.getElementById("fechaBoleta");
        const datosClienteEl = document.getElementById("datosCliente");
        const datosEntregaEl = document.getElementById("datosEntrega");

        numeroBoletaEl.textContent = "Boleta N° " + (orden.numero || "DT-XXXXXX");

        const fecha = orden.fechaCreacion ? new Date(orden.fechaCreacion) : new Date();
        fechaBoletaEl.textContent = "Fecha: " + fecha.toLocaleString("es-CL");

        datosClienteEl.textContent =
            "Cliente: " + (datosEntrega.nombreDestinatario || "Sin nombre");

        datosEntregaEl.textContent =
            "Entrega en: " +
            (datosEntrega.direccion || "Sin dirección") + ", " +
            (datosEntrega.comuna || "") +
            " | Tipo: " + (datosEntrega.tipoEntrega === "envio" ? "Envío a domicilio" : "Retiro en tienda") +
            " | Fecha: " + (datosEntrega.fecha || "-") +
            " (" + (datosEntrega.franja || "-") + ")";

        // === Tabla de productos ===
        const tbody = document.getElementById("tablaProductos");
        let subtotal = 0;

        carrito.forEach(item => {
            subtotal += item.precio;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.nombre}</td>
                <td class="text-center">${item.tamano || "-"}${item.tamano ? " pers." : ""}</td>
                <td>${item.mensaje || "(sin mensaje)"}</td>
                <td class="text-end">${formatear(item.precio)}</td>
            `;
            tbody.appendChild(tr);
        });

        const costoEnvio = datosEntrega.costoEnvio || 0;
        const total      = subtotal + costoEnvio;

        document.getElementById("subtotalBoleta").textContent = "Subtotal: " + formatear(subtotal);
        document.getElementById("envioBoleta").textContent    = "Envío: "    + formatear(costoEnvio);
        document.getElementById("totalBoleta").textContent    = "Total: "    + formatear(total);
    </script>

</body>
</html>
