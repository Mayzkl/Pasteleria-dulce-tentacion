<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boleta digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body style="background-color:#FFF7F0;" class="d-flex flex-column min-vh-100">
    <div id="navbar-container"></div>

    <div class="container my-5">
        <h2 class="text-center mb-4 fw-bold">Boleta digital</h2>

        <!-- Datos generales -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <p class="mb-1"><strong>N° Pedido:</strong> <span id="bol-numero">-</span></p>
                <p class="mb-1"><strong>Fecha:</strong> <span id="bol-fecha">-</span></p>
                <p class="mb-1"><strong>Cliente:</strong> <span id="bol-cliente">-</span></p>
                <p class="mb-1"><strong>Email:</strong> <span id="bol-email">-</span></p>
                <p class="mb-1"><strong>Dirección:</strong> <span id="bol-direccion">-</span></p>
                <p class="mb-1"><strong>Comuna:</strong> <span id="bol-comuna">-</span></p>
                <p class="mb-1"><strong>Tipo entrega:</strong> <span id="bol-tipo-entrega">-</span></p>
                <p class="mb-0"><strong>Franja:</strong> <span id="bol-franja">-</span></p>
            </div>
        </div>

        <!-- Detalle productos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Detalle de productos</h5>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Tamaño</th>
                                <th>Relleno</th>
                                <th>Mensaje</th>
                                <th class="text-end">Precio</th>
                            </tr>
                        </thead>
                        <tbody id="bol-items"></tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end mt-3">
                    <div class="text-end">
                        <div>Subtotal: <span id="bol-subtotal">$0</span></div>
                        <div>Costo envío: <span id="bol-envio">$0</span></div>
                        <div class="fw-bold fs-5">Total: <span id="bol-total">$0</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">
                Volver al inicio
            </button>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-light mt-auto">
        <p class="mb-0">© 2025 Dulce Tentación — Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
    <script src="navbar.js"></script>
    <script src="BoletaDigital.js"></script>
</body>
</html>
