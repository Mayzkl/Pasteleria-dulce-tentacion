<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de tortas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<body style="background-color: #fff7f0;" class="d-flex flex-column min-vh-100">

<div id="navbar-container"></div>

<section class="container my-4">
    <h2 class="text-center mb-4 fw-bold">Catálogo de tortas</h2>

    <div class="row mb-3 justify-content-center">
        <div class="col-12 col-md-6 mb-2">
            <input type="text" class="form-control shadow-sm" placeholder="Buscar productos...">
        </div>
        <div class="col-12 col-md-4 mb-2">
            <select class="form-select shadow-sm">
                <option selected>Todas las categorías</option>
                <option>Tortas clásicas</option>
                <option>Tortas frutales</option>
                <option>Tortas especiales</option>
            </select>
        </div>
    </div>

    <div id="gridCatalogo" class="row g-3"></div>
</section>

<footer class="text-center py-3 bg-dark text-light mt-auto">
    © 2025 Dulce Tentación — Todos los derechos reservados
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="usuarios.js"></script>
<script src="navbar.js"></script>
<script src="productos.js"></script>

<script>
// Cargar productos correctamente en gridCatalogo
const contenedor = document.getElementById("gridCatalogo");

PRODUCTOS.forEach(prod => {
    const col = document.createElement("div");
    col.className = "col-12 col-sm-6 col-md-4 col-lg-3";

    col.innerHTML = `
        <div class="card h-100 shadow-sm">
            <img src="${prod.imagen}" class="card-img-top" alt="${prod.nombre}">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title text-center">${prod.nombre}</h5>
                <p class="card-text text-center small">${prod.descripcionCorta}</p>
                <p class="fw-bold text-center text-primary mb-3">${formatearPrecio(prod.precio)}</p>
                <button class="btn btn-primary mt-auto w-100"
                        onclick="window.location.href='personalizacion.html?id=${prod.id}'">
                    Personalizar
                </button>
            </div>
        </div>
    `;

    contenedor.appendChild(col);
});
</script>

</body>
</html>
